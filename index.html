<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёт</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0E3B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Учёт">
<style>
:root{
  --bg:#F2F4F1;--card:#FFFFFF;--tx:#14191A;--mut:#646C67;--bd:#E1E5E0;
  --ac:#1B7A4E;--acTx:#FFFFFF;--soft:#E5F2EA;--hero:#0E3B2C;--heroTx:#FFFFFF;--heroMut:#B9DFCB;
  --red:#B93A2C;--grn:#1B7A4E;--gold:#B07D12;--shadow:0 1px 2px rgba(16,24,20,.05),0 2px 8px rgba(16,24,20,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1210;--card:#181E1B;--tx:#ECF1EE;--mut:#9BA49F;--bd:#28302C;
  --ac:#4CC38A;--acTx:#0B1F15;--soft:#1B2D24;--hero:#14533B;--heroTx:#FFFFFF;--heroMut:#B9DFCB;
  --red:#FF8A7A;--grn:#5FD39A;--gold:#E2B54A;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;height:100vh;height:100dvh}
#hd,#app{width:100%;max-width:560px;margin:0 auto;padding-left:14px;padding-right:14px}
#hd{flex:none;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#sc{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#app{padding-bottom:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 12px}
header h1{font-size:26px;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;min-height:36px;flex:none}
.dot i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.ok i{background:var(--grn)}.dot.busy i{background:var(--gold);animation:pl 1s infinite}.dot.err i{background:var(--red)}
@keyframes pl{50%{opacity:.25}}

nav{flex:none;background:var(--card);border-top:1px solid var(--bd);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
nav>div{display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:7px 0 5px;min-height:54px;border-radius:14px}
nav button.on{color:var(--ac)}
nav button.on svg{background:var(--soft);border-radius:99px;padding:2px 14px;width:52px;box-sizing:content-box;margin:-2px 0}

button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 12px;min-height:46px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.985)}
button:disabled{opacity:.4}
button.p{background:var(--ac);border-color:var(--ac);color:var(--acTx);font-weight:650;width:100%}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
textarea{height:150px;resize:vertical}
input[type=file]{display:none}
label.f{display:block;margin-top:10px}
label.f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:17px;font-weight:700}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.ch input{width:auto;min-height:38px;padding:6px 10px;font-size:14px}
.mut{color:var(--mut);font-size:14px}
.neg{color:var(--red)}.pos{color:var(--grn)}
.note{background:var(--soft);color:var(--tx);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.note.err{background:transparent;border:1px solid var(--red);color:var(--red)}
.empty{color:var(--mut);padding:14px 0 4px;font-size:15px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;min-height:126px;box-shadow:var(--shadow)}
.tile .tn{font-size:15px;font-weight:650;color:var(--mut);display:flex;align-items:center;justify-content:space-between;width:100%}
.tile .tb{font-size:24px;font-weight:750;letter-spacing:-.02em;margin-top:auto;line-height:1.15}
.tile .tb.s{font-size:20px}
.tile .tm{font-size:12px;color:var(--mut)}
.tile.hero{background:var(--hero);border-color:var(--hero);color:var(--heroTx)}
.tile.hero .tn,.tile.hero .tm{color:var(--heroMut)}
.tile.hero .neg{color:#FFB8AC}
.tile.wide{width:100%;min-height:0;margin-bottom:12px;cursor:default}
.tile.wide .tb{font-size:32px;margin-top:10px}

.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:12px 4px;border-radius:16px}
.qa button svg{color:var(--ac)}
.qa button.on{background:var(--soft);border-color:var(--ac)}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.rl{min-width:0}
.rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{display:flex;align-items:center;gap:4px;flex:none}
.x{border:0;background:none;color:var(--mut);min-height:40px;min-width:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px}
.dh{font-size:13px;font-weight:650;color:var(--mut);padding:14px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.dh:first-child{padding-top:0}
.total{display:flex;justify-content:space-between;align-items:center;gap:10px}
.total b{font-size:20px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ac);font-weight:650;padding:4px 2px 12px;min-height:40px}
details>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:650;min-height:28px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin:0 6px 4px}
details[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.oi{width:130px;min-height:40px;padding:6px 10px;text-align:right}
.sm{display:flex;gap:8px;margin-top:10px}.sm>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid button small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:14px;margin-top:10px}
.seg button{border:0;background:none;min-height:40px;border-radius:11px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.sc .top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.amt{font-size:36px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.who{font-size:18px;margin-top:4px;word-break:break-word}
.q{font-weight:650;margin-top:16px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.big button{min-height:92px;font-size:19px;font-weight:700;border-radius:18px}
.big .bp{background:var(--hero);border-color:var(--hero);color:#fff}
.big .bw{background:var(--soft);border-color:var(--ac)}
.sug{display:flex;gap:12px;align-items:center;text-align:left;width:100%;margin-top:16px;background:var(--soft);border:1.5px solid var(--ac);border-radius:16px;padding:12px 14px}
.sug svg{color:var(--ac);flex:none}
.ghost{width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut)}
.nav2{display:flex;gap:8px;margin-top:16px}.nav2 button{flex:1;font-size:15px}
.link{border:0;background:none;color:var(--mut);text-decoration:underline;font-size:14px;min-height:40px;width:100%;margin-top:4px}
.filebtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--bd);border-radius:14px;padding:14px;margin-top:10px;cursor:pointer;font-weight:600}
.filebtn svg{color:var(--ac)}

.hcard{background:var(--hero);color:var(--heroTx);border-radius:22px;padding:18px;margin-bottom:12px}
.hcard .lbl{color:var(--heroMut);font-size:14px}
.hcard .amt{color:#fff;margin:4px 0}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15)}
.hrow b{font-size:20px;color:#fff}
.pc .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pc .pn{font-size:18px;font-weight:700}
.pc .pv{font-size:20px;font-weight:750;white-space:nowrap}
.pf{margin-top:10px}

.sumrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.sumrow:last-child{border:0}
.hb{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.hb i{display:block;height:100%;background:var(--ac);border-radius:4px}
.cols{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:12px}
.cols i{flex:1;background:var(--ac);border-radius:4px 4px 1px 1px;min-height:2px;opacity:.85}
.cols i.t{opacity:1;background:var(--gold)}

#lock{position:fixed;inset:0;background:var(--bg);z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lock img{width:72px;height:72px;border-radius:18px;margin-bottom:16px}
.pins{font-size:26px;letter-spacing:12px;height:44px;margin-top:8px;color:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(3,78px);gap:14px;margin-top:10px}
.kp button{height:78px;border-radius:50%;font-size:26px;padding:0}
</style>
</head>
<body>
<header id="hd"></header>
<div id="sc"><main id="app"></main></div>
<nav id="nav"></nav>
<div id="lock"></div>
<script>
/* ---------- настройки учёта ---------- */
const CORE=["Личное","Доставка","Бонус","Штраф"];
const SUB=["Еда","Дорога","Развлечения","Одежда","Другое"];
const WORK=[["Доставка","Доставка"],["На сайт","Доставка"],["На офис","Доставка"],["Бонус","Бонус"],["Штраф","Штраф"]];
const OWN=/депозит|своего сч|свои сч|своих сч/i;

let S={acc:CORE.map(n=>({n,o:0})),tx:[]};
let cfg={url:"",key:""},q=[],tab="home",items=[],i=0,cur={s:"top"},msg="",draft="",st="",stT=0,busy=false,again=false,lastPull=0;
let whoList=[],pre="",accSel=null,homePanel=null,detOpen=false,addSign=-1,retHome=false,debtOpen=null,debtMode="repay",ppl=[];

const $=s=>document.querySelector(s);
const top0=()=>{const e=document.getElementById("sc");if(e)e.scrollTop=0};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(Math.abs(n)).toLocaleString("ru-RU");
const money=n=>(Math.round(n)<0?"−":"")+fmt(n)+" ₸";
const sg=n=>(n<0?"−":"+")+fmt(n)+" ₸";
const cls=n=>n<0?"neg":"pos";
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>parseFloat(String(v).replace(/\s/g,"").replace(",","."));
const norm=s=>String(s||"").toLowerCase().replace(/ё/g,"е").replace(/[.]/g,"").replace(/\s+/g," ").trim();
const sameP=(a,b)=>a===b||(a.split(" ")[0]&&a.split(" ")[0]===b.split(" ")[0]);
const sum=a=>a.reduce((s,t)=>s+Math.abs(t.a),0);
let day=today();

/* ---------- иконки ---------- */
const ic=(p,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={
  home:ic('<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>'),
  sort:ic('<path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/>'),
  an:ic('<path d="M5 20V11M12 20V5M19 20v-6M3 20h18"/>'),
  debt:ic('<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.6a3.2 3.2 0 0 1 0 6.3M21 20c0-2.6-1.5-4.8-3.8-5.6"/>'),
  set:ic('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
  doc:ic('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'),
  plus:ic('<path d="M12 5v14M5 12h14"/>'),
  swap:ic('<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>'),
  x:ic('<path d="M6 6l12 12M18 6L6 18"/>',18),
  back:ic('<path d="M15 5l-7 7 7 7"/>',20),
  chev:ic('<path d="M9 5l7 7-7 7"/>',16)
};

/* ---------- хранение ---------- */
function load(){
  try{const x=JSON.parse(localStorage.getItem("led2")||"null");if(x&&x.acc)S=x}catch(e){}
  try{const c=JSON.parse(localStorage.getItem("cfg2")||"null");if(c)cfg=c}catch(e){}
  try{q=JSON.parse(localStorage.getItem("q2")||"[]")}catch(e){}
}
function persist(){try{localStorage.setItem("led2",JSON.stringify(S));localStorage.setItem("q2",JSON.stringify(q))}catch(e){}}
function ensureCore(){let ch=false;CORE.forEach(n=>{if(!S.acc.some(a=>a.n===n)){S.acc.push({n,o:0});ch=true}});return ch}
function op(o){q.push(o);persist();sync()}
function addTx(list){S.tx.push(...list);op({action:"add",tx:list})}

/* ---------- синхронизация ---------- */
async function rj(r){try{return await r.json()}catch(e){throw new Error("скрипт ответил не так: проверьте ссылку и что развёрнута новая версия")}}
const errTxt=e=>({key:"неверный пароль",busy:"таблица занята, повторю позже",json:"ошибка данных"})[e]||e||"ошибка";
async function post(o){
  const r=await fetch(cfg.url,{method:"POST",body:JSON.stringify({key:cfg.key,...o})});
  const j=await rj(r);if(!j.ok)throw new Error(errTxt(j.error));
}
async function pull(){
  const r=await fetch(cfg.url+(cfg.url.includes("?")?"&":"?")+"key="+encodeURIComponent(cfg.key)+"&t="+Date.now());
  const j=await rj(r);if(j.error)throw new Error(errTxt(j.error));
  return j;
}
const clean=t=>{const o={id:String(t.id),d:t.d,a:Number(t.a),n:t.n};["acc","sub","k","p"].forEach(f=>{if(t[f])o[f]=t[f]});return o};
function merge(){for(let k=0;k<q.length-1;k++){if(q[k].action==="add"&&q[k+1].action==="add"){q[k]={action:"add",tx:q[k].tx.concat(q[k+1].tx)};q.splice(k+1,1);k--}}}
function calm(){
  const a=document.activeElement;
  return !(tab==="sort"&&items.length)&&debtOpen===null&&homePanel===null&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName));
}
async function sync(force){
  if(!cfg.url)return;
  if(busy){again=true;return}
  if(!navigator.onLine){paintSt();return}
  busy=true;paintSt();
  const before=JSON.stringify(S);
  try{
    merge();
    while(q.length){await post(q[0]);q.shift();persist();merge()}
    if(force||Date.now()-lastPull>60000){
      const j=await pull();lastPull=Date.now();
      if(!q.length){
        if(j.acc&&j.acc.length)S.acc=j.acc;
        S.tx=(j.tx||[]).map(clean);
        if(ensureCore()){q.push({action:"acc",acc:S.acc});again=true}
        persist();
      }
    }
    st="ok";stT=Date.now();
  }catch(e){st="Ошибка: "+e.message}
  busy=false;
  if(again){again=false;if(q.length&&st==="ok")return sync()}
  paintSt();
  if(JSON.stringify(S)!==before&&calm())render();
}
function stLong(){
  if(!cfg.url)return "Не подключено: данные только на этом телефоне";
  if(st&&st!=="ok")return st;
  return (stT?"Синхронизировано в "+new Date(stT).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):"Подключено")+(q.length?" · в очереди: "+q.length:"");
}
function paintSt(){
  const d=$("#sdot");
  if(d){
    let c="",t;
    if(!cfg.url)t="Не подключено";
    else if(busy){c="busy";t="Сохраняю…"}
    else if(!navigator.onLine){c="err";t="Офлайн"+(q.length?" · "+q.length:"")}
    else if(st&&st!=="ok"){c="err";t="Ошибка"}
    else if(q.length){c="busy";t="В очереди "+q.length}
    else{c="ok";t="Сохранено"}
    d.className="dot "+c;d.innerHTML="<i></i>"+t;
  }
  const s=$("#stx");if(s)s.textContent=stLong();
}
function dotTap(){if(!cfg.url||(st&&st!=="ok"))go("set");else sync(true)}

/* ---------- каркас ---------- */
const TABS=[["home","Счета","home"],["sort","Разбор","sort"],["an","Анализ","an"],["debt","Қарыз","debt"],["set","Ещё","set"]];
function go(t){if(t!==tab)msg="";tab=t;accSel=null;homePanel=null;debtOpen=null;render();top0()}
function render(){
  $("#nav").innerHTML=`<div>${TABS.map(([k,l,c])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')">${IC[c]}<span>${l}</span></button>`).join("")}</div>`;
  const title={home:accSel!==null&&S.acc[accSel]?S.acc[accSel].n:"Мои счета",sort:"Разбор",an:"Анализ",debt:"Қарыз дәптер",set:"Настройки"}[tab];
  $("#hd").innerHTML=`<h1>${esc(title)}</h1><button class="dot" id="sdot" onclick="dotTap()"></button>`;
  paintSt();
  $("#app").innerHTML=({home:vHome,sort:vSort,an:vAn,debt:vDebt,set:vSet})[tab]();
}

/* ---------- Счета (главная) ---------- */
const bal=a=>a.o+S.tx.filter(t=>t.acc===a.n).reduce((s,t)=>s+t.a,0);
const ordered=()=>CORE.map(n=>S.acc.find(a=>a.n===n)).filter(Boolean).concat(S.acc.filter(a=>!CORE.includes(a.n)));
const monthOut=n=>{const m=ym(0);return sum(S.tx.filter(t=>t.acc===n&&t.a<0&&t.k!=="tr"&&t.d.startsWith(m)))};
function meta(t){
  if(t.k==="tr")return "Перевод · "+t.acc;
  if(t.k==="lend")return "Қарыз · дал"+(t.acc?" · "+t.acc:" · вручную");
  if(t.k==="repay")return "Қарыз · вернули"+(t.acc?" · "+t.acc:" · вручную");
  return [t.acc,t.sub].filter(Boolean).join(" · ");
}
function txRow(t){return `<div class="row"><div class="rl"><div class="rn">${esc(t.p||t.n)}</div><div class="mut">${esc(meta(t))}</div></div><div class="rr"><b class="${cls(t.a)}">${sg(t.a)}</b><button class="x" onclick="del('${esc(t.id)}')" aria-label="Удалить операцию">${IC.x}</button></div></div>`}
function dlabel(d){

}

/* ---------- Разбор ---------- */
function parse(t){
  return t.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    let d=null;const dm=l.match(/^(\d{4}-\d{2}-\d{2})\s+(.*)$/);if(dm){d=dm[1];l=dm[2]}
    const m=l.match(/^([+\-−–]?)\s*(\d[\d\s.,]*)\s+(.+)$/);
    if(!m)return null;
    const n=num(m[2]);
    if(isNaN(n))return null;
    return{d,a:(m[1]===""||m[1]==="+")?n:-n,n:m[3].replace(/\s*\([+\-]\)\s*$/,"").replace(/^(.+?)\.?\s*перевод.*$/i,"$1").trim()};
  }).filter(Boolean);
}
function debtors(){
  const P={};
  S.tx.filter(t=>t.k==="lend"||t.k==="repay").forEach(t=>{const k=norm(t.p||t.n);(P[k]=P[k]||{key:k,n:t.p||t.n,o:[]}).o.push(t)});
  return Object.values(P).map(p=>({...p,owed:-p.o.reduce((s,t)=>s+t.a,0)}));
}
function findMan(person,a){
  const k=norm(person),used=new Set(items.map(x=>x.link).filter(Boolean));
  return S.tx.find(t=>t.k==="repay"&&!t.acc&&t.a===a&&!used.has(t.id)&&sameP(norm(t.p||t.n),k));
}
function sugFor(it){
  if(it.a<=0)return null;
  const k=norm(it.n),p=debtors().find(d=>sameP(d.key,k));
  if(!p)return null;
  const man=findMan(p.n,it.a);
  if(man)return{p,man};
  if(p.owed>0)return{p};
  return null;
}

}
function start(fromPdf){

  let dup=0,own=0;
  items=p.map(x=>({...x,d:x.d||day})).filter(x=>{if(OWN.test(x.n)){own++;return false}const k=x.d+"|"+x.a+"|"+x.n;if(have[k]>0){have[k]--;dup++;return false}return true});
  i=0;cur={s:"top"};retHome=false;

  if(!items.length){msg=msg||"Новых операций нет";render();return}
  render();top0();
}
function nxt(){i++;cur={s:"top"};if(i>=items.length)finish();else{render();top0()}}
function pickTop(k){const it=items[i];if(k==="p"){it.acc="Личное";if(it.a<0){cur.s="sub";render()}else nxt()}else{cur.s="work";render()}}
function pickSub(x){items[i].sub=SUB[x];nxt()}
function pickWork(x){const it=items[i];it.sub=WORK[x][0];it.acc=WORK[x][1];nxt()}
function pickOther(x){items[i].acc=S.acc[x].n;nxt()}
function pickDebt(){const it=items[i];it.k=it.a<0?"lend":"repay";it.acc="Личное";cur.s="who";render()}
function pickWhoX(x){const it=items[i];it.p=whoList[x].n;if(it.k==="repay"){const m=findMan(it.p,it.a);if(m)it.link=m.id}nxt()}
function pickWho(){const it=items[i];it.p=$("#who").value.trim()||it.n;if(it.k==="repay"){const m=findMan(it.p,it.a);if(m)it.link=m.id}nxt()}

function clr(it){["skip","k","sub","p","acc","link"].forEach(f=>delete it[f])}
function back(){

  if(i>0){i--;clr(items[i]);cur={s:"top"};render()}
}
function stopEarly(){if(!confirm(`Сохранить ${i} разобранных? Остальные можно разобрать потом, загрузив ту же выписку.`))return;items=items.slice(0,i);finish()}
function finish(){
  const done=items.filter(t=>!t.skip);
  const links=done.filter(t=>t.link).map(t=>t.link);
  const ok=done.map(({skip,link,...t})=>({...t,id:uid()}));
  if(links.length){S.tx=S.tx.filter(t=>!links.includes(t.id));links.forEach(id=>q.push({action:"del",id}))}
  if(ok.length)addTx(ok);else{persist();sync()}
  msg=(retHome?"Операция сохранена":`Сохранено операций: ${ok.length}`)+(pre?". "+pre:"");pre="";items=[];draft="";
  if(retHome){retHome=false;tab="home"}
  render();top0();
}

/* ---------- PDF ---------- */
function loadPdfJs(){
  return new Promise((ok,no)=>{
    if(window.pdfjsLib)return ok();
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";ok()};
    s.onerror=()=>no(new Error("нужен интернет для первого чтения PDF"));
    document.head.appendChild(s);
  });
}
async function readPdf(file){
  try{
    msg="Читаю PDF…";render();
    await loadPdfJs();
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const lines=[];
    for(let n=1;n<=pdf.numPages;n++){
      const tc=await(await pdf.getPage(n)).getTextContent();
      const its=tc.items.filter(x=>x.str.trim()).map(x=>({x:x.transform[4],y:x.transform[5],s:x.str})).sort((a,b)=>b.y-a.y);
      let g=[],gy=null;
      const flush=()=>{if(g.length)lines.push(g.sort((a,b)=>a.x-b.x).map(r=>r.s).join(" ").replace(/\s+/g," ").trim());g=[]};
      its.forEach(r=>{if(gy===null||Math.abs(r.y-gy)>3){flush();gy=r.y}g.push(r)});flush();
    }
    const re=/^(\d{2})\.(\d{2})\.(\d{2,4})\s+([+\-−–])\s*(\d[\d\s]*(?:[.,]\d{1,2})?)\s*(?:₸|KZT|T)?\s*(.*)$/;
    const out=[];
    lines.forEach(l=>{
      const m=l.match(re);if(!m)return;
      const y=m[3].length===2?"20"+m[3]:m[3],v=num(m[5]);
      if(isNaN(v))return;
      const nm=m[6].trim().replace(/^Поступление со\s+/i,"").replace(/^(Перевод|Покупка|Пополнение|Снятие|Разное)\s+/i,(a,w)=>/перевод/i.test(w)?"":w+" ");
      out.push(`${y}-${m[2]}-${m[1]} ${/[+]/.test(m[4])?"+":"-"}${v} ${nm||"Операция"}`);
    });
    if(out.length){draft=out.join("\n");msg=`Найдено операций: ${out.length}`;start(true);return}
    draft=lines.join("\n");msg="Не удалось распознать операции автоматически. Проверьте текст ниже.";
  }catch(e){msg="Ошибка PDF: "+e.message}
  render();
}
function pickPdf(el){const f=el.files&&el.files[0];if(f){const de=$("#dt");if(de)day=de.value||day;readPdf(f)}}
async function checkShare(){
  if(!sp.get("share"))return;
  tab="sort";
  try{
    const c=await caches.open("share");
    const t=await c.match("__st"),f=await c.match("__sf");
    if(t){draft=await t.text();await c.delete("__st")}
    if(f){const b=await f.blob();await c.delete("__sf");history.replaceState(null,"",location.pathname);await readPdf(b);return}
  }catch(e){}
  history.replaceState(null,"",location.pathname);render();
}

/* ---------- Анализ ---------- */
function ym(o){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function cmpRows(title,keys,fc,fp){
  const mx=Math.max(1,...keys.map(k=>Math.max(fc(k),fp(k))));
  const rows=keys.map(k=>{const c=fc(k),p=fp(k);if(!c&&!p)return"";const d=p?Math.round((c-p)/p*100):null;
  return `<div><div class="sumrow" style="border:0;padding-bottom:0"><span>${esc(k)}</span><span><b>${fmt(c)}</b> <span class="mut">было ${fmt(p)}${d===null?"":` · <span class="${d>0?"neg":"pos"}">${d>0?"+":""}${d}%</span>`}</span></span></div><div class="hb"><i style="width:${c/mx*100}%"></i></div></div>`}).join("");
  return `<div class="card"><h3 style="margin-bottom:8px">${title}</h3>${rows||'<div class="empty">Пока нет данных</div>'}</div>`;
}
let anAll=false;
function vAn(){
  const tx=S.tx.filter(t=>!t.k),c=ym(0),p=ym(-1);
  const E=m=>tx.filter(t=>t.a<0&&t.d.startsWith(m)),I=m=>tx.filter(t=>t.a>0&&t.d.startsWith(m));
  const pe=m=>E(m).filter(t=>t.acc==="Личное"),we=m=>E(m).filter(t=>t.acc&&t.acc!=="Личное");
  const pc=sum(pe(c)),pp=sum(pe(p)),wc=sum(we(c)),ic_=sum(I(c)),ip=sum(I(p));
  /* дни, за которые есть загруженные операции */
  const dset=m=>[...new Set(S.tx.filter(t=>t.k!=="tr"&&t.acc&&t.d.startsWith(m)).map(t=>t.d))];
  const dc=dset(c).length,dp=dset(p).length;
  const avg=dc?pc/dc:0,avgp=dp?pp/dp:0;
  /* по дням */
  const pick=t=>t.a<0&&(anAll?!!t.acc:t.acc==="Личное");
  const byDay={};tx.filter(pick).forEach(t=>byDay[t.d]=(byDay[t.d]||0)+Math.abs(t.a));
  const allDays=[...new Set(S.tx.filter(t=>t.k!=="tr"&&t.acc).map(t=>t.d))].sort().reverse().slice(0,14);
  const mx=Math.max(1,...allDays.map(d=>byDay[d]||0));
  const peakEntry=Object.entries(byDay).filter(([d])=>d.startsWith(c)).sort((a,b)=>b[1]-a[1])[0];
  const wk=t=>WORK.some(w=>w[0]===t.sub)?t.sub:(t.acc==="Офис"?"На офис":t.acc);
  const wkeys=[...new Set(WORK.map(w=>w[0]).concat(we(c).concat(we(p)).map(wk)))];
  const mname=new Date().toLocaleDateString("ru-RU",{month:"long"});
  const diff=pp?Math.round((pc-pp)/pp*100):null;
  return `<div class="hcard"><div class="lbl">Личные расходы · ${mname}</div><div class="amt">${fmt(pc)} ₸</div>
  <div class="lbl">в прошлом месяце ${fmt(pp)} ₸${diff===null?"":` · ${diff>0?"+":""}${diff}%`}</div>
  <div class="hrow"><div><div class="lbl">В среднем в день</div><b>${fmt(avg)} ₸</b></div><div><div class="lbl">Дней с данными</div><b>${dc}</b></div></div></div>
  <div class="card"><div class="ch"><h3>Расход по дням</h3></div>
  <div class="seg" style="margin-top:4px"><button class="${anAll?"":"on"}" onclick="anAll=false;render()">Личные</button><button class="${anAll?"on":""}" onclick="anAll=true;render()">Все</button></div>
  ${allDays.length?allDays.map(d=>{const v=byDay[d]||0;return `<div class="dayrow"><div class="sumrow" style="border:0;padding:8px 0 2px"><span>${dlabel(d)}</span><b>${v?fmt(v)+" ₸":"—"}</b></div><div class="hb" style="margin:0 0 4px"><i style="width:${v/mx*100}%"></i></div></div>`}).join(""):'<div class="empty">Пока нет данных</div>'}
  <div class="mut" style="margin-top:6px">Показаны последние 14 дней, за которые вы загружали выписку</div></div>
  <div class="card">
  <div class="sumrow"><span>Личные расходы</span><b>${fmt(pc)} ₸</b></div>
  <div class="sumrow"><span>Рабочие расходы</span><b>${fmt(wc)} ₸</b></div>
  <div class="sumrow"><span>Доходы</span><span><b class="pos">${fmt(ic_)} ₸</b> <span class="mut">было ${fmt(ip)}</span></span></div>
  <div class="sumrow"><span>Средний личный расход в прошлом месяце</span><b>${fmt(avgp)} ₸</b></div>
  ${peakEntry?`<div class="sumrow"><span>Самый затратный день${anAll?"":" (личное)"}</span><b>${dlabel(peakEntry[0])} · ${fmt(peakEntry[1])} ₸</b></div>`:""}</div>
  ${cmpRows("Личное: на что",SUB,k=>sum(pe(c).filter(t=>(t.sub||"Другое")===k)),k=>sum(pe(p).filter(t=>(t.sub||"Другое")===k)))}
  ${cmpRows("Работа: куда",wkeys,k=>sum(we(c).filter(t=>wk(t)===k)),k=>sum(we(p).filter(t=>wk(t)===k)))}`;
}

/* ---------- Қарыз дәптер ---------- */
function hist(p){
  return p.o.slice().sort((a,b)=>a.d<b.d?1:-1).map(t=>`<div class="row"><div class="rl"><div>${t.k==="lend"?"Дал":"Вернул(а)"} <b>${fmt(t.a)} ₸</b></div><div class="mut">${dlabel(t.d)}${t.acc?"":" · вручную"}</div></div><button class="x" onclick="del('${esc(t.id)}')" aria-label="Удалить запись">${IC.x}</button></div>`).join("");
}
function vDebt(){
  ppl=debtors().sort((a,b)=>b.owed-a.owed);
  const act=ppl.filter(p=>Math.round(p.owed)!==0),closed=ppl.filter(p=>Math.round(p.owed)===0);
  const tot=act.reduce((s,p)=>s+Math.max(0,p.owed),0),cnt=act.filter(p=>p.owed>0).length;
  const card=p=>{
    const x=ppl.indexOf(p),open=debtOpen===x;
    return `<div class="card pc"><div class="ph"><div><div class="pn">${esc(p.n)}</div><div class="mut">${p.owed>0?"должен(на) вам":"вы должны вернуть"}</div></div><div class="pv ${p.owed>0?"neg":"pos"}">${fmt(p.owed)} ₸</div></div>
    ${open?`<div class="pf"><div class="seg"><button class="${debtMode==="repay"?"on":""}" onclick="debtMode='repay';fillPD(${x},this)">Вернул(а)</button><button class="${debtMode==="lend"?"on":""}" onclick="debtMode='lend';fillPD(${x},this)">Дал ещё</button></div>
      <div class="grid" style="margin-top:0"><label class="f"><span>Сумма, ₸</span><input id="pa" type="number" inputmode="decimal" value="${debtMode==="repay"?Math.max(0,Math.round(p.owed)):""}"></label><label class="f"><span>Дата</span><input id="pd" type="date" value="${today()}"></label></div>
      <div class="sm"><button onclick="debtOpen=null;render()">Отмена</button><button class="p" onclick="savePD(${x})">Сохранить</button></div></div>`
    :`<div class="sm">${p.owed>0?`<button class="p" onclick="repayAll(${x})">Вернул(а) всё</button>`:""}<button onclick="openPD(${x},'repay')">${p.owed>0?"Частично":"Вернул(а)"}</button><button onclick="openPD(${x},'lend')">Дал ещё</button></div>`}
    <details style="margin-top:10px"><summary class="mut">История (${p.o.length})</summary>${hist(p)}</details></div>`;
  };
  return `<div class="hcard"><div class="lbl">Вам должны всего</div><div class="amt">${fmt(tot)} ₸</div><div class="lbl">${cnt?cnt+" чел.":"никто не должен"}</div></div>
  ${act.map(card).join("")}
  <div class="card"><h3>Новый долг</h3>
  <label class="f"><span>Кому дали</span><input id="dp" placeholder="Имя"></label>
  <div class="grid" style="margin-top:0"><label class="f"><span>Сумма, ₸</span><input id="da" type="number" inputmode="decimal" placeholder="0"></label><label class="f"><span>Дата</span><input id="dd" type="date" value="${today()}"></label></div>
  <button class="p" style="margin-top:12px" onclick="addDebt()">Добавить</button>
  <div class="mut" style="margin-top:8px">Ручные записи не меняют остатки. Если деньги потом придут на карту, при разборе выписки приложение само предложит связать их с этой записью, дубля не будет.</div></div>
  ${closed.length?`<details class="card"><summary>Закрытые долги (${closed.length})</summary>${closed.map(p=>`<div class="dh">${esc(p.n)}</div>${hist(p)}`).join("")}</details>`:""}`;
}
function openPD(x,m){debtOpen=x;debtMode=m;render();const e=$("#pa");if(e){e.focus();e.select()}}
function fillPD(x,el){el.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===el));$("#pa").value=debtMode==="repay"?Math.max(0,Math.round(ppl[x].owed)):"";$("#pa").focus()}
function savePD(x){
  const p=ppl[x],a=Math.abs(num($("#pa").value)),d=$("#pd").value||today();
  if(!a){alert("Укажите сумму");return}
  addTx([{id:uid(),d,a:debtMode==="lend"?-a:a,n:p.n,p:p.n,k:debtMode}]);debtOpen=null;render();
}
function repayAll(x){
  const p=ppl[x],a=Math.round(p.owed);
  if(!confirm(`${p.n} вернул(а) ${fmt(a)} ₸?`))return;
  addTx([{id:uid(),d:today(),a,n:p.n,p:p.n,k:"repay"}]);render();
}
function addDebt(){
  const p=$("#dp").value.trim(),a=Math.abs(num($("#da").value)),d=$("#dd").value||today();
  if(!p||!a){alert("Укажите имя и сумму");return}
  addTx([{id:uid(),d,a:-a,n:p,p,k:"lend"}]);render();
}

/* ---------- Настройки ---------- */
function vSet(){
  return `<div class="card"><h3>Google Таблица</h3><div class="mut">Ссылка веб-приложения (Apps Script) и пароль из скрипта</div>
  <label class="f"><span>Ссылка /exec</span><input id="cu" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(cfg.url)}"></label>
  <label class="f"><span>Пароль</span><input id="ck" placeholder="Пароль" value="${esc(cfg.key)}"></label>
  <button class="p" style="margin-top:12px" onclick="saveCfg()">Сохранить и синхронизировать</button>
  ${cfg.url?`<button style="width:100%;margin-top:8px" onclick="sync(true)">Обновить данные из таблицы</button>`:""}
  <div class="mut" id="stx" style="margin-top:10px">${esc(stLong())}</div></div>
  <div class="card"><h3>PIN-код</h3><div class="mut">${hasPin()?"PIN включён. Чтобы отключить, введите текущий PIN.":"Защита входа в приложение, 4 цифры"}</div>
  <input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="4 цифры" style="margin-top:10px" aria-label="PIN"><button class="p" style="margin-top:10px" onclick="${hasPin()?"offPin()":"setPin()"}">${hasPin()?"Отключить PIN":"Установить PIN"}</button><div class="mut" id="pst" style="margin-top:8px">Если забудете PIN, очистите данные сайта в браузере: всё вернётся из Google Таблицы.</div></div>
  <details class="card"><summary>Перенос из старой версии</summary><div class="mut" style="margin-top:8px">Вставьте данные из старого приложения (Счета → «Данные для переноса»)</div>
  <textarea id="imp" style="margin-top:8px"></textarea><button class="p" style="margin-top:10px" onclick="doImport()">Импортировать</button><div class="mut" id="impst" style="margin-top:6px"></div></details>`;
}
async function saveCfg(){
  cfg={url:$("#cu").value.trim(),key:$("#ck").value.trim()};
  try{localStorage.setItem("cfg2",JSON.stringify(cfg))}catch(e){}
  if(!cfg.url){st="";render();return}
  st="";$("#stx").textContent="Подключаюсь…";
  try{
    const j=await pull();
    if(S.tx.length)q.push({action:"add",tx:S.tx});
    if(!(j.acc&&j.acc.length))q.push({action:"acc",acc:S.acc});
    persist();
  }catch(e){st="Ошибка: "+e.message;paintSt();return}
  sync(true);
}
function doImport(){
  const el=$("#impst");
  try{
    const o=JSON.parse($("#imp").value);
    const acc=(o.meta&&o.meta.acc)||o.acc;
    const tx=o.tx||Object.values(o.m||{}).flat();
    if(!acc||!Array.isArray(tx))throw 0;
    S.acc=acc;ensureCore();S.tx=tx.map((t,x)=>({...clean(t),id:t.id||("imp-"+t.d+"-"+t.a+"-"+x)}));
    q.push({action:"acc",acc:S.acc},{action:"add",tx:S.tx});persist();sync();
    el.textContent="Перенесено операций: "+S.tx.length;
  }catch(e){el.textContent="Не получилось прочитать данные"}
}

/* ---------- PIN ---------- */
let lk=false,buf="",bad=0,until=0,hid=0;
const hasPin=()=>{try{return !!localStorage.getItem("pin2")}catch(e){return false}};
async function hashPin(p,s){
  const b=new TextEncoder().encode(s+p);
  if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest("SHA-256",b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  return s+p.split("").reverse().join("");
}
function lockOn(){if(hasPin()){lk=true;buf="";drawLock()}}
function drawLock(m){
  const L=$("#lock");
  if(!lk){L.style.display="none";L.innerHTML="";return}
  L.style.display="flex";
  L.innerHTML=`<img src="icon-192.png" alt=""><div style="font-size:20px;font-weight:650">Введите PIN</div><div class="pins">${"●".repeat(buf.length)+"○".repeat(4-buf.length)}</div><div class="neg" style="height:22px">${m||""}</div><div class="kp">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button onclick="key('${k}')" aria-label="${k==="⌫"?"Стереть":k}">${k}</button>`).join("")}</div>`;
}
async function key(k){
  if(Date.now()<until)return drawLock("Подождите 30 секунд");
  if(k==="⌫")buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;
  drawLock();
  if(buf.length<4)return;
  const ok=await hashPin(buf,localStorage.getItem("pins2"))===localStorage.getItem("pin2");
  if(ok){lk=false;bad=0;drawLock();return}
  bad++;buf="";if(bad>=5){until=Date.now()+30000;bad=0}
  drawLock(Date.now()<until?"Подождите 30 секунд":"Неверный PIN");
}
async function setPin(){
  const v=$("#pn").value;
  if(!/^\d{4}$/.test(v)){$("#pst").textContent="Нужно ровно 4 цифры";return}
  const s=uid();localStorage.setItem("pins2",s);localStorage.setItem("pin2",await hashPin(v,s));
  render();$("#pst").textContent="PIN установлен";
}
async function offPin(){
  const v=$("#pn").value;
  if(await hashPin(v,localStorage.getItem("pins2"))===localStorage.getItem("pin2")){localStorage.removeItem("pin2");localStorage.removeItem("pins2");render()}
  else $("#pst").textContent="Неверный PIN";
}

/* ---------- запуск ---------- */
load();
if(ensureCore()){persist();if(cfg.url)q.push({action:"acc",acc:S.acc})}
const sp=new URLSearchParams(location.search),shared=sp.get("text")||sp.get("title");
if(shared){draft=shared;tab="sort";history.replaceState(null,"",location.pathname)}
lockOn();render();sync(true);checkShare();
addEventListener("online",()=>sync());
addEventListener("offline",paintSt);
setInterval(()=>{if(q.length&&!document.hidden)sync()},120000);
document.addEventListener("visibilitychange",()=>{if(document.hidden)hid=Date.now();else{if(hid&&Date.now()-hid>30000)lockOn();sync(Date.now()-lastPull>30000)}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
